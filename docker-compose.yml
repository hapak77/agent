services:
  app:
    build: .
    container_name: freelance-radar
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    restart: unless-stopped
    depends_on: []

  # Optional PostgreSQL for server deployments
