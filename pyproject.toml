[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freelance-radar"
version = "0.1.0"
description = "Freelance Radar AI — autonomous freelance order discovery and first-contact agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "telethon>=1.36,<2",
  "httpx>=0.27,<1",
  "selectolax>=0.3.21",
  "feedparser>=6.0,<7",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "greenlet>=3.0,<4",
  "alembic>=1.14,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "APScheduler>=3.10,<4",
  "python-dotenv>=1.0,<2",
  "structlog>=24.4,<26",
  "tenacity>=9.0,<10",
  "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6.0,<7",
  "ruff>=0.8,<1",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
freelance-radar = "freelance_radar.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
